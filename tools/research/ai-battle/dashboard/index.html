<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN AI Battle</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --ok: #2f7d4f; --warn: #a86a12; --bad: #b23a3a;
    --c0: #2f6fdb; --c1: #d4542b; --c2: #1f9a7a; --c3: #8b4fc9; --c4: #c79a12; --c5: #5d6b7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f;
      --ok: #5cc98a; --warn: #e0a84a; --bad: #ef7a7a;
      --c0: #6c9bf0; --c1: #f07f57; --c2: #4cc7a3; --c3: #b386ec; --c4: #e8c24a; --c5: #9aa7b4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px;
           align-items: baseline; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 8px 24px 32px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 16px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         margin-right: 6px; vertical-align: -1px; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .online { color: var(--ok); } .offline, .error { color: var(--bad); }
  .no-binary { color: var(--warn); }
  .hosts { display: flex; flex-wrap: wrap; gap: 10px; }
  .host { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 170px;
          flex: 1 1 170px; }
  .host b { font-size: 15px; }
  .slots { display: flex; gap: 4px; margin-top: 6px; }
  .slot { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
  .slot.busy { background: var(--ok); }
  .live { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .match { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .match .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c0); }
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; margin-top: 6px; }
  .events { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 260px;
            overflow-y: auto; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  @media (max-width: 860px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: minmax(0, 1fr); }
    .live { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>LAN AI Battle</h1>
  <span class="sub" id="meta">connecting…</span>
</header>
<main>
  <section class="panel wide"><h2>Arenas</h2><div class="hosts" id="hosts"></div></section>
  <section class="panel wide"><h2>Live matches</h2><div class="live" id="live"></div></section>
  <section class="panel"><h2>Leaderboard</h2><div class="scroll" id="board"></div></section>
  <section class="panel"><h2>Recent results</h2><div class="scroll" id="recent"></div></section>
  <section class="panel wide"><h2>Replays on another arena (determinism)</h2><div class="scroll" id="det"></div></section>
  <section class="panel wide"><h2>Orchestrator log</h2><div class="events" id="events"></div></section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let colours = {};

function colour(key) { return colours[key] || 'var(--c5)'; }
function money(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(2) + ' B';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + ' M';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + ' k';
  return String(v);
}
function dur(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; }

function chart(m, cfg) {
  const W = 420, H = 180, L = 40, R = 8, T = 8, B = 20;
  const start = cfg.start_year, end = cfg.start_year + m.years;
  const x = (t) => { const [y, mo] = t.split('-').map(Number); return L + (W - L - R) * ((y + (mo - 1) / 12 - start) / (end - start)); };
  let max = 1;
  for (const s of Object.values(m.series)) for (const p of s) max = Math.max(max, p.value);
  const lmax = Math.log10(Math.max(10, max));
  const y = (v) => T + (H - T - B) * (1 - Math.log10(Math.max(1, v)) / lmax);
  let g = '';
  for (let e = 0; e <= Math.floor(lmax); e += (lmax > 6 ? 2 : 1)) {
    const yy = y(10 ** e);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>` +
         `<text x="${L - 4}" y="${yy + 3}" text-anchor="end">${money(10 ** e)}</text>`;
  }
  for (let yr = start; yr <= end; yr += 5) {
    const xx = x(yr + '-1');
    g += `<text x="${xx}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
  }
  for (const [key, s] of Object.entries(m.series)) {
    if (!s.length) continue;
    const pts = s.map((p) => `${x(p.t).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
    g += `<polyline fill="none" stroke="${colour(key)}" stroke-width="2" points="${pts}"><title>${esc(key)}</title></polyline>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="company value over time (log scale)">${g}</svg>`;
}

function render(st) {
  st.contestants.forEach((k, i) => { colours[k] = `var(--c${i % 6})`; });
  const p = st.provenance || {};
  $('meta').textContent = `${st.contestants.length} contestants · ${st.match_cfg.years}-year free-for-all from ${st.match_cfg.start_year} · ` +
    `${2 ** st.match_cfg.map_x}×${2 ** st.match_cfg.map_y} ${st.match_cfg.landscape} · edition ${st.edition.slice(0, 8)} · PrismaticAI @ ${(p.rev || '').slice(0, 10)}${p.dirty ? ' (DIRTY)' : ''} · updated ${new Date(st.now * 1000).toLocaleTimeString()}`;

  $('hosts').innerHTML = st.hosts.map((h) => `
    <div class="host"><b>${esc(h.name)}</b> <span class="${h.state}">${h.state}</span>
      <div class="sub">${esc(h.version || h.detail || '')}</div>
      <div class="sub">${h.running}/${h.slots} running · ${h.done} done</div>
      <div class="slots">${Array.from({ length: h.slots }, (_, i) => `<span class="slot ${i < h.running ? 'busy' : ''}"></span>`).join('')}</div>
    </div>`).join('');

  $('live').innerHTML = st.live.length ? st.live.map((m) => {
    let last = '';
    for (const s of Object.values(m.series)) if (s.length && s[s.length - 1].t > last) last = s[s.length - 1].t;
    const yNow = last ? Number(last.split('-')[0]) + (Number(last.split('-')[1]) - 1) / 12 : st.match_cfg.start_year;
    const pct = Math.min(100, 100 * (yNow - st.match_cfg.start_year) / m.years);
    const rows = m.lineup.map((c) => {
      const s = m.series[c.key] || [];
      return { key: c.key, p: s[s.length - 1] || {}, err: (m.errors || {})[c.key] || 0 };
    }).sort((a, b) => (b.p.value || 0) - (a.p.value || 0));
    return `<div class="match">
      <div class="top"><b>${m.id}${m.replica_of ? ` <span class="pill">replay of ${esc(m.replica_of)}</span>` : ''}</b><span class="sub">${esc(m.host)} · seed ${m.seed} · ${last || 'starting'} · ${dur(st.now - m.started_at)}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${chart(m, st.match_cfg)}
      <table><tr><th>AI</th><th class="num">value</th><th class="num">veh</th><th class="num">stations</th></tr>
      ${rows.map((r) => `<tr><td><span class="dot" style="background:${colour(r.key)}"></span>${esc(r.key)}${r.err ? ` <span class="pill bad" title="Squirrel errors">${r.err} err</span>` : ''}</td>
        <td class="num">${money(r.p.value || 0)}</td><td class="num">${r.p.vehicles || 0}</td><td class="num">${r.p.stations || 0}</td></tr>`).join('')}
      </table></div>`;
  }).join('') : '<div class="empty">No match running yet.</div>';

  $('board').innerHTML = `<table><tr><th>#</th><th>AI</th><th class="num">played</th><th class="num">wins</th><th class="num">points</th><th class="num">avg rank</th><th class="num">avg value</th></tr>
    ${st.leaderboard.map((r, i) => `<tr><td>${i + 1}</td><td><span class="dot" style="background:${colour(r.key)}"></span>${esc(r.key)}</td>
      <td class="num">${r.played}</td><td class="num">${r.wins}</td><td class="num">${r.points}</td>
      <td class="num">${r.avg_rank ?? '–'}</td><td class="num">${money(r.avg_value)}</td></tr>`).join('')}</table>
    <div class="sub" style="margin-top:8px">Points per match: last place 0, each place above +1. Only matches that reached the final year count; replays don't.</div>`;

  $('recent').innerHTML = st.recent.length ? `<table><tr><th>match</th><th>arena</th><th>status</th><th>winner</th><th class="num">value</th></tr>
    ${st.recent.map((m) => {
      const w = (m.standings || [])[0];
      return `<tr><td>${m.id}${m.replica_of ? ' ↺' : ''}</td><td>${esc(m.host)}</td><td>${m.status}</td>
        <td>${w ? `<span class="dot" style="background:${colour(w.key)}"></span>${esc(w.key)}` : '–'}</td>
        <td class="num">${w ? money(w.value) : '–'}</td></tr>`;
    }).join('')}</table>` : '<div class="empty">No finished matches yet.</div>';

  $('det').innerHTML = st.determinism.length ? `<table><tr><th>seed</th><th>original</th><th>replay</th><th>arenas</th><th>builds</th><th>result</th></tr>
    ${st.determinism.map((d) => `<tr><td>${d.seed}</td><td>${d.original}</td><td>${d.replay}</td><td>${d.hosts.map(esc).join(' / ')}</td>
      <td class="sub">${d.versions.map(esc).join(' / ')}</td><td class="${d.identical ? 'online' : 'error'}">${d.identical ? 'identical' : 'DIFFERENT'}</td></tr>`).join('')}</table>`
    : '<div class="empty">No replay finished yet: every few matches one is replayed on another arena with the same seed and start order.</div>';

  $('events').innerHTML = st.events.slice().reverse().map((e) => `<div>${e.at} ${esc(e.msg)}</div>`).join('');
}

async function tick() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    $('meta').textContent = 'orchestrator unreachable — is `battle.py run` still running?';
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
