[project]
name = "noirgfx"
version = "0.1.0"
description = "RESEARCH-ONLY: builds the NoirGFX base graphics set (SIG NIHL noir) from OpenGFX"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
]

[project.scripts]
noirgfx = "noirgfx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noirgfx"]
