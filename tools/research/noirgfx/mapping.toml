# Which Kenney model replaces which OpenGFX sprite. Models are "<pack>/<name>" under
# assets/kenney-curated/. Each replaced sprite keeps its number; its 32bpp alternatives come from the
# render (stylized by stylize.py:run_rgb) instead of from the OpenGFX pixels, and the OpenGFX 8bpp
# original stays as the 8bpp fallback. Sprites not listed here are restyled from OpenGFX.

# --- trees -------------------------------------------------------------------------------------
# OpenGFX base sprites 0x628..0x7d9: 62 tree types x 7 growth stages (src/table/tree_land.h; stage 3
# is grown). Every stage is fitted to the height of the OpenGFX sprite it replaces, so growth and
# the game's placement stay exactly as designed; dying stages darken the crown, dead is near black.
[kinds.tree]
first = 0x628
stride = 7
stages = [
    { dark = 0.0 }, { dark = 0.0 }, { dark = 0.0 }, { dark = 0.0 },
    { dark = 0.35 }, { dark = 0.65 }, { dark = 0.9 },
]

