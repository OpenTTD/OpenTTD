[package]
name = "mcp-rhai"
version = "0.1.0"
edition = "2021"
description = "RESEARCH-ONLY: run Rhai scripts against the OpenTTD MCP control panel"
publish = false

[dependencies]
# metadata: the engine lists its functions with their signatures for the Scripts page (I0088);
# debugging: breakpoints, stepping, scope and call stack for the Scripts page's debugger (I0090).
rhai = { version = "1.19", features = ["serde", "metadata", "debugging"] }
ureq = { version = "2.10", features = ["json"] }
serde_json = "1"
serde = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# mcp-panel: signals (SIGINT/SIGTERM stop the game with the panel), kill(pid, 0), local time.
libc = "0.2"
# mcp-panel's bus tap (ADR 0033): the event bus on a ZeroMQ PUB socket, pure Rust (no system libzmq),
# on a small tokio runtime of its own thread.
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
bytes = "1"
# The real-world scenario compiler (tools/research/real-world), linked so the panel serves the one
# implementation instead of a copy (src/panel_realworld.rs).
rw-scenario = { path = "../real-world", default-features = false }
# ... and into a DuckDB file per instance, linked against the system libduckdb 1.5 (Homebrew; build.rs
# finds it), never the bundled C++ build. The crate's version 1.105xx.y is DuckDB 1.5.xx.
duckdb = { version = "=1.10505.0", default-features = false, optional = true }
# battle-postmortem (research/battle-postmortem.md): reads the LAN battle's machine store
# (~/ttd-battle/results/battle.sqlite, written by battle.py) read-only, and analyses every match in
# parallel on all cores.
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"

[features]
default = ["store"]
# The DuckDB store of mcp-panel; without it the panel runs and reports "store": "off".
store = ["dep:duckdb"]
