<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>OpenTTD Interface</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 antialiased" data-page="ui">
  <script src="/static/shell.js"></script>


  <main class="pb-8">
    <span id="u-stats" data-nav-extra class="hidden md:inline"></span>
    <div class="flex flex-wrap items-center gap-3 mb-4 p-3 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700">
      <label class="inline-flex items-center gap-2 text-sm text-gray-900 dark:text-white"><input id="p-widgets" type="checkbox" checked class="w-4 h-4"> Show widgets</label>
      <label class="text-sm text-gray-900 dark:text-white">Window
        <select id="p-window" class="ms-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-1.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"><option value="all">All windows</option></select>
      </label>
      <span id="u-armed" class="text-xs font-medium px-2.5 py-0.5 rounded-sm"></span>
      <span class="text-xs text-gray-500 dark:text-gray-400">Every window and widget of your game, derived from openttd.ui.windows; class names from src/window_type.h. Click a widget to press it in the game (when input is armed); click elsewhere to see what is there.</span>
    </div>
    <div class="grid gap-4 xl:grid-cols-4">
      <section class="xl:col-span-3 p-3 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700" data-frame>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Your screen, live</h3>
          <button type="button" data-maximize class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-xs px-2 py-1 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700">Maximize</button>
        </div>
        <div id="screen" class="relative w-full select-none" role="img" aria-label="The owner's game window with every window and widget as a clickable area">
          <img id="screen-img" alt="" class="w-full rounded-sm bg-gray-900">
          <div id="overlay" class="absolute inset-0"></div>
        </div>
        <p id="u-msg" class="mt-2 text-sm text-gray-500 dark:text-gray-400"></p>
      </section>
      <section class="p-3 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700">
        <h3 class="mb-2 text-lg font-semibold text-gray-900 dark:text-white">Open windows</h3>
        <ul id="windows" class="space-y-2 text-sm"></ul>
      </section>
    </div>
  </main>

  <script src="/vendor/flowbite.min.js"></script>
  <script src="/static/ui.js"></script>
</body>
</html>
