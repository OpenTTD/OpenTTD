id: I0053
milestone: an-agent-reaches-the-game-over-mcp
title: "The route planner calibrated to the game's payment formula, vehicle speeds, passenger generation and base prices"
slug: planner-calibrated-to-the-game
priority: p1
profile: implementation
parallel_safe: true
objective: "Replace the planner's guessed value curve with the game's own formulas, read from the sources and recorded in .ai knowledge, so mode choice and profitability are grounded and every constant stays an external parameter."
why: "The owner: have you analysed all sources and algorithms, documented them in .ai? choose the right combination of transport modes; best algorithms for planning and profitability."
scope:
  - "tools/research/mcp-rhai/**"
  - "tools/research/mcp-panel/**"
  - "research/mcp-control.md"
  - ".ai/repo/knowledge/curated/cargo-payment-and-vehicle-speed.md"
non_scope:
  - "Vehicle purchase and running costs (next: live engine data); the bot building rail or air"
depends_on:
  - I0050
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "plan.rs computes income per passenger from GetTransportedGoodsIncome's time factor, transit periods from the vehicle movement code, and costs from pricebase.h; a unit test pins the time factor to the source"
  - "Every constant is a parameter echoed in the answer; what is not modelled is listed in every answer"
  - "The knowledge record cites each formula with file and line"
  - "mcp-view-check passes against a running stack"
validation:
  - "cargo test --release --bin mcp-plan (tools/research/mcp-rhai)"
  - "tools/research/mcp-view-check"
evidence_required:
  - validation_run
