  - "an-agent-plays-the-game-through-governed-channels#an-agent-reaches-the-game-over-mcp"
acceptance_criteria:
  - "a panel started with the option serves static/ from that directory, and one started without it serves the same files as today"
  - "cargo test of mcp-panel and mcp-hub pass; mcp-hub-check against a panel started with the option passes"
validation:
  - "cargo test --release --bin mcp-panel --bin mcp-hub"
evidence_required:
