id: I0091
milestone: rhai-is-a-live-ide
title: "Scripts share an inspectable memory, and a live console evaluates in a running session"
slug: rhai-shared-memory
priority: p2
profile: implementation
parallel_safe: true
objective: "A panel-side shared memory (shared_get, shared_set, shared_keys, shared_watch) every script and service reads and writes, shown live on the Scripts page, each write a rhai.shared event on the bus and in the store; a console that evaluates an expression in a persistent session scope."
why: "Services such as the steward and the monitor share nothing but the board; the owner asked for shared memory and for scripts that are invokable and inspectable in real time."
scope:
