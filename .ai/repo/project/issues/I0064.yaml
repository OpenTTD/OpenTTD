id: I0064
milestone: an-agent-reaches-the-game-over-mcp
title: "Planner v4: freight routes from the world graph priced per cargo, an investment portfolio chosen by AlgoGlyph's knapsack-dp, and the bot builds freight rail"
slug: planner-v4-freight-and-portfolio
priority: p1
profile: implementation
parallel_safe: true
objective: "Analyse producer, consumer and carrier links properly: price every producer to acceptor pair with its cargo's own payment rate and transit periods, choose the investments that fit the budget with a real solver (AlgoGlyph knapsack-dp), and have the bot build what the portfolio chose."
why: "The owner: it never builds cargo, which is often more profitable; it does not analyse producer, consumer and carrier links; ROI is computed wrongly; algoglyph has everything for simulation, calculation and modelling."
scope:
  - "src/prismatic_mcp/prismatic_mcp_world.cpp"
  - "tools/research/**"
  - "research/**"
non_scope:
  - "Trucks for freight; signals and several trains per line; AlgoGlyph traces in the UI (kernel id, input and work are shown)"
depends_on:
  - I0059
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "openttd://engines carries every cargo's payment rate and transit periods"
  - "mcp-plan lists freight pairs from openttd://world/graph industries, each with truck and freight rail options priced by the game's time factor for that cargo (one load per round trip)"
  - "The portfolio is chosen by AlgoGlyph knapsack-dp when MCP_ALGOGLYPH_DIR names its runner, by the same built-in DP otherwise, and the answer names the solver, kernel and input; a unit test pins the built-in to AlgoGlyph's answer"
  - "The panel starts the bot from the portfolio (fr_from, fr_to, fr_cargo; rail; air) and /world shows the portfolio with its solver"
  - "The bot builds a freight line with a full-load train; an A/B run with planner v4 is committed as evidence"
validation:
  - "cargo test --release --bin mcp-plan (tools/research/mcp-rhai)"
  - "tools/gate.sh research"
  - "tools/research/mcp-ab --months 12"
evidence_required:
  - validation_run
