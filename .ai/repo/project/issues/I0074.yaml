id: I0074
milestone: an-agent-reaches-the-game-over-mcp
title: "Every rail type with its build cost, so a plan on electric, monorail or maglev track is priced as the game prices it"
slug: railtypes
priority: p2
profile: implementation
parallel_safe: true
objective: "openttd://railtypes lists every rail type in use (label, name, RailBuildCost now, cost and maintenance multipliers, speeds, powered and compatible types, the companies that may build it), and algoglyph.track_plan takes railtype by label or index and passes its entry to AlgoGlyph's track-planning."
why: "The owner: plan with the cost of construction and equipment. AlgoGlyph prices track, bridge decks and tunnel track as RailBuildCost = build_rail x the rail type's cost multiplier >> 3; without the multiplier every non-plain line is priced as plain rail."
scope:
  - "src/prismatic_mcp/**"
  - "tools/research/mcp-rhai/**"
  - "research/**"
  - ".ai/**"
depends_on:
  - I0073
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "openttd://railtypes lists every rail type whose label is not empty, with build_cost equal to RailBuildCost"
  - "algoglyph.track_plan with railtype passes that type's entry; an unknown label is refused naming the game's types; a cargo test covers it"
  - "Live: the default climate's rail types are listed, and a plan with railtype ELRL is priced above the same plan on RAIL"
validation:
  - "tools/gate.sh research"
  - "cargo test --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-hub"
evidence_required:
  - validation_run
created_at: '2026-11-16'
