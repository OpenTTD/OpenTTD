title: "GET /api/rhai/functions derives every function a script can call, with signature and doc"
slug: rhai-function-catalogue
priority: p1
profile: implementation
parallel_safe: true
objective: "One route answers the functions a Rhai script can call in the panel's engine: the host functions of src/main.rs with their doc lines, the derived ones (one per MCP tool, console command and OpenAPI operation, each with its schema) and the exported functions of every library script with its doc comment, all derived, none listed by hand."
why: "Completion, hover, the docs and an agent writing a script all need the same answer, and today it exists only as tools() commands() help() inside a running script."
