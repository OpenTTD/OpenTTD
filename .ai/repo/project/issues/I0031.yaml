    result: "live on build-gate-research/openttd (master dc83e0b870 + this change, both research options ON): mcp-e2e brought up the dedicated server, MCP, PrismaticAI, the panel at 127.0.0.1:8800 and a spectator GUI client (clients: mcp-observer, company 255); panel API: live state and companies, set_pause pending #1 -> approved -> executed, paused true observed, decisions recorded; ~ console: companies, clients, list_cmds returned their output; mcp-rhai derived 4 tool functions and 83 con_* functions; demo.rhai exit 0: new world (27 towns), PrismaticAI company, 10 watched reports through MCP, pause #3 and resume #5 approved through the panel with the tick frozen 4171 -> 4171 over 3 s, final report, 5 decisions. Found and fixed on the way: PrismaticAI idled when the largest town had no second stop site (bridge repo cb443a1, then Lonningpool Transport with 3 buses, value 10951)"
