id: I0031
milestone: an-agent-reaches-the-game-over-mcp
title: "Drive a running game from outside: MCP control window, tilde developer console, Rhai derived from the live catalogue, one-command end-to-end run"
slug: mcp-control-window-console-rhai
priority: p1
profile: implementation
parallel_safe: true
objective: "Let the owner, a script or an agent start a game, watch it and steer it through the embedded MCP server from outside, interactively and fully automatically, with every MCP tool and console command reachable from Rhai without hand-written bindings."
why: "The owner asked for an end-to-end, externally controlled MCP integration with a control window, an extended tilde console and Rhai extensibility; the server existed, nothing drove it beyond a curl runbook."
scope:
  - "tools/research/mcp-panel/**"
  - "tools/research/mcp-rhai/**"
  - "tools/research/mcp-e2e"
  - "research/mcp-control.md"
  - ".gitignore"
non_scope:
  - "New MCP tools and resources in src/prismatic_mcp: carried on branch research/mcp-full-auto by the session that owns the C++ side"
  - "An agent that approves its own decisions: approval stays the operator's act (panel button or the owner's auto-approve switch)"
depends_on: []
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "tools/research/mcp-e2e starts the server, MCP, PrismaticAI, the control window and a spectator GUI client in one command"
  - "The control window shows live state, companies, decisions, resources and tools, and pauses and resumes through the approval flow"
  - "The ~ console sends OpenTTD console commands, raw MCP calls, resource reads and Rhai scripts"
  - "mcp-rhai derives one function per tools/list entry and per list_cmds command at start-up"
  - "rhai/demo.rhai runs a new world to a final report through MCP and the console, with the pause approved by the operator"
validation:
  - "tools/research/mcp-e2e"
  - "tools/research/mcp-rhai/target/release/mcp-rhai tools/research/mcp-panel/rhai/demo.rhai"
evidence_required:
  - validation_run
