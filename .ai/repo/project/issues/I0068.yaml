id: I0068
milestone: an-agent-reaches-the-game-over-mcp
title: "Routes over capacity reported from the game's own link graph, mature links only"
slug: capacity-audit
priority: p2
profile: implementation
parallel_safe: true
objective: "A route that runs more vehicles than its traffic needs is named in every running game, with the game's measured capacity and usage, through hub.audit, mcp-hub audit, mcp-dup-check and GraphQL."
why: "The owner: it often builds redundant connections beyond capacity, miscounted and never recomputed."
scope:
  - "tools/research/mcp-rhai/**"
  - "research/mcp-hub.md"
  - "research/README.md"
  - ".ai/**"
depends_on:
  - I0060
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "hub.audit carries per instance the routes whose both directions need fewer vehicles than they run, from cargo_link capacity and usage and the vehicles' orders and capacities"
  - "A link is judged only when mature (measured capacity covers every assigned vehicle); a single vehicle is never too many"
  - "cargo test covers the rule (mature, not mature, full, single vehicle, train capacity fallback)"
validation:
  - "cargo test --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-hub"
evidence_required:
  - validation_run
