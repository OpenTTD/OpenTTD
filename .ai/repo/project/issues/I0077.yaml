objective: "Every view tool declares readOnlyHint (a local-GUI default when it declares nothing), a unit test holds every View, UI and Menu tool to it, and mcp-coverage-check --probe --exercise calls every tool once on a throwaway headless client, requiring a well-formed answer and naming any tool without readOnlyHint."
