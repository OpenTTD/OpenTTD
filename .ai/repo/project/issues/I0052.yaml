id: I0052
milestone: an-agent-reaches-the-game-over-mcp
title: "The GUI client as a derived surface: every client tool a route, every window and widget on a generic /ui page"
slug: gui-client-derived-surface
priority: p1
profile: implementation
parallel_safe: true
objective: "Reach every window of the owner's game generically: derive a REST/OpenAPI/Rhai route for every tool the GUI client offers, name window classes from the source, and draw every window and widget as a clickable mirror that presses it when the owner armed input."
why: "The owner: wire this panel to MCP, for other AIs and interactions too; I need a generic connection, inferred, derived, dynamic, integrated with .ai and Majordomus, deployed, verified and validated."
scope:
  - "tools/research/**"
  - "research/mcp-control.md"
  - ".ai/repo/rules/project/mcp-surfaces-are-derived.v1.md"
non_scope:
  - "The UI and input tools themselves (I0044, prismatic_mcp_ui.cpp); arming input, which is the owner's switch"
depends_on:
  - I0044
  - I0051
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "Every tool of the attached GUI client's live tools/list is a route POST /api/client/<tool> in OpenAPI and a Rhai api_client_* function, with no tool named by hand"
  - "Window class names are derived from src/window_type.h (GET /api/ui/classes)"
  - "/ui draws every window and widget from openttd.ui.windows; a widget click presses it only when input is armed (mcp-e2e --arm-input), else it reads"
  - "Unarmed input is refused; mcp-view-check and mcp-panel-check pass; the rule project.mcp-surfaces-are-derived names the client surface and its proof"
validation:
  - "tools/research/mcp-view-check"
  - "tools/research/mcp-panel-check"
evidence_required:
  - validation_run
