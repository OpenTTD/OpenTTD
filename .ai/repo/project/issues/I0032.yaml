id: I0032
milestone: an-agent-reaches-the-game-over-mcp
title: "Derive REST routes, an OpenAPI 3.1 document with Swagger UI, and an SSE/REST event stream from the live MCP catalogue"
slug: mcp-openapi-events
priority: p1
profile: implementation
parallel_safe: true
objective: "Expose every MCP tool and resource, and every game event, on REST, OpenAPI, Swagger UI, SSE and Rhai from one declaration and the live catalogue, so an external program can drive the game data-first."
why: "The owner asked for events over websocket/REST, documented, data-driven, with Swagger/OpenAPI and a single declaration feeding multiple surfaces, and for proof that the whole game can be driven through the derived API."
scope:
  - "tools/research/mcp-panel/**"
  - "tools/research/mcp-rhai/**"
  - "tools/research/mcp-panel-check"
  - "tools/research/mcp-e2e"
  - "research/mcp-control.md"
non_scope:
  - "New MCP tools in src/prismatic_mcp (the command-table catalogue is carried on branch research/mcp-full-auto)"
  - "A WebSocket transport: SSE carries the same feed one way over plain HTTP"
depends_on:
  - I0031
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "The panel's routes are declared once; /openapi.json documents them and adds one route per tools/list and resources/list entry"
  - "POST /api/tools/<name> and GET /api/resources/<path> answer for every derived route"
  - "Swagger UI is served at /docs"
  - "Events from MCP state differences, decisions, AI log and the console reach GET /api/events and the SSE stream, filterable by kind"
  - "Rhai reads the same feed (events, ttd::wait_event)"
  - "tools/research/mcp-panel-check passes against a running panel"
validation:
  - "tools/research/mcp-panel-check --panel http://127.0.0.1:8800"
evidence_required:
  - validation_run
