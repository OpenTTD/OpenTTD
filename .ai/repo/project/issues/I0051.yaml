objective: "Let the bot, a script or another AI talk to the owner inside the game: the company newspaper with a manager's face, and yes/no questions in the game's own dialog whose answers come back over MCP and steer what happens next."
why: "The owner, with a screenshot of the 'New transport company launched!' newspaper: wire this panel to MCP, also for other AIs and interactions, reuse it, make it interactive; top-notch human-AI interaction."
scope:
