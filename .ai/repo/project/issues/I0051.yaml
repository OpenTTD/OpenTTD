acceptance_criteria:
  - "openttd.view.news.show style company shows the newspaper with a company's manager face; an unknown company is refused"
  - "openttd.view.ask opens the game's yes/no dialog without focus; answers are yes, no (also a closed dialog) or replaced; they appear in GET /api/ask and as event ask.answered"
