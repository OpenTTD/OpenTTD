id: I0086
milestone: planning-is-generated-from-recorded-history
title: "A long-lived AlgoGlyph flow serve is fed trailing data from the store, so kernels see history and not one snapshot"
slug: algoglyph-reads-the-store
priority: p3
profile: implementation
parallel_safe: true
objective: "A subscriber in mcp-rhai holds one AlgoGlyph flow serve (as mcp-human's Flow does), follows the panel's ZeroMQ socket, and feeds transport-investment and knapsack-dp inputs built from the store's trailing samples and plan.* events (real earnings per mode, the lines already built) next to the live resources. Each call is published as plan.kernel {kernel, inputs (live and stored, with row counts), answer}. Without a store the kernels get today's live inputs and the event says fallback."
why: "Every kernel input is a live snapshot today (invest.rs input, cargo.rs portfolio, linecost.rs price), started per call with npm run flow -- kernel or kept by mcp-human only; AlgoGlyph has no ZeroMQ or DuckDB code. ADR 0034 point 4: AlgoGlyph's inputs are assembled from the store by its caller."
scope:
  - "tools/research/mcp-rhai/src/invest.rs"
  - "tools/research/mcp-rhai/src/cargo.rs"
  - "tools/research/mcp-rhai/src/hub_algoglyph.rs"
  - "tools/research/mcp-rhai/src/flow_serve.rs"
