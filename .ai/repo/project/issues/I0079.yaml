id: I0079
milestone: the-game-wears-the-owners-noir-style
title: "NoirGFX: a SIG NIHL red-black linocut base graphics set, generated from OpenGFX by a reproducible pipeline"
slug: noirgfx
priority: p2
profile: implementation
parallel_safe: true
objective: "A pluggable base graphics set (.obg + .grf, selectable in Game Options like any other) that restyles every OpenGFX sprite into the owner's SIG NIHL style: strict black / cream paper / signal red, carved linocut hatching, high resolution (32bpp, 4x extra zoom) and seamless across neighbouring tiles. Produced by tools/research/noirgfx from the upstream OpenGFX release, deterministic, with Kenney CC0 models rendered in OpenTTD's projection replacing original assets. AI refinement of selected categories (the owner's choice) is follow-up work, not part of this issue."
why: "The owner asked for a whole graphics pack in their sharp dark-noir style, made with AI/LLM help, put into the project cleanly, automated, pluggable, every tile redone in high resolution, seamless and continuous. OpenGFX is GPL-2, so a derived set is distributable with its source; the base set mechanism (ADR 0028) is the clean plug point and needs no engine change. The owner's answers, verbatim: research/noirgfx/owner-answers.md."
