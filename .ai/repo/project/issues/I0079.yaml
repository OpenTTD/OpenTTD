acceptance_criteria:
  - "tools/research/noirgfx/noirgfx build produces NoirGFX (.obg + six .grf) from the pinned OpenGFX 8.0 release; the same input gives byte-identical output"
  - "Every 8bpp sprite of OpenGFX keeps its number, size and offsets, and gains a 32bpp alternative at normal, 2x and 4x zoom drawn from one 4x master"
  - "Ground sprites carry a hatch pattern that is a function of screen position modulo the tile lattice (128 x 32 px at 4x), so neighbouring tiles join without seams at any height"
  - "Company colour pixels keep their palette mask, so players' colours still apply"
  - "The set loads in the fork's build and an in-game screenshot is recorded under research/noirgfx/"
  - "Mapped sprites (every non-toyland tree, all growth stages) come from Kenney renders cached by content hash; noirgfx check passes on the set that contains them"
validation:
  - "tools/research/noirgfx/noirgfx check"
evidence_required:
  - validation_run
