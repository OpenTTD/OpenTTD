  - I0053
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "The panel passes the planner's best air pair to the bot (air_a, air_b) and records it as an event; --no-plan-bot starts without it"
  - "PrismaticAI builds both airports at accepted-passenger sites and flies planes that fit (bridge repository, air.nut)"
  - "mcp-ab runs two same-seed games and writes research/results/ab-*.{json,md} with value, money, loan and vehicles per month"
  - "A completed A/B run is committed as evidence, whatever its outcome"
  - "openttd://engines lists the vehicles on offer with price, running cost, effective speed and capacity; planner v3 uses them, picks the fleet size that maximises the score, and respects a budget"
  - "The panel passes an air pair only when planner v3 scores it above zero"
validation:
