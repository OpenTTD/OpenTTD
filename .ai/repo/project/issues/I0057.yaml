priority: p1
profile: implementation
parallel_safe: true
objective: "Close the loop from model to money: the panel starts the bot with the planner's best air pair, the bot flies it, and a same-seed A/B run records company value month by month with and without the planner."
why: "The owner: until a whole game is finished and won, rinse and repeat; we need results; everything must work; choose the right combination of transport modes."
