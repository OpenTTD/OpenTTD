id: I0069
milestone: an-agent-reaches-the-game-over-mcp
title: "The owner's sentences answered over the live game: an intent resolver whose words come from the game itself"
slug: owner-sentences-intent-resolver
priority: p1
profile: implementation
parallel_safe: true
objective: "Let the owner type a plan in plain language (Czech or English): 'najdi nejproduktivnější les', 'najdi nejbližší les + pilu', 'vystav trať mezi nejproduktivnějším lesem a pilou', 'vybuduj nejlukrativnější trať'. Resolve it over the live world into ordered candidates and, for build, the bot settings that carry out the first, with no hand-written list of nouns."
why: "The owner (2026-11-15, Kompendium session, handed over by kompendium-epistemicke-anihilace-2e and openttd-a0): type in the ~ console 'vybuduj nejlukrativnější trať' and have MCP and the whole AI layer carry out the plan; everything generic, derived, inferred, documented."
scope:
  - "tools/research/mcp-rhai/**"
  - "tools/research/mcp-panel/server.py"
  - "tools/research/mcp-view-check"
  - "research/mcp-control.md"
non_scope:
  - "The ~ console verb (openttd-59's console commands); executing a build in a running company (needs openttd.ai.set_setting); the hub surface (openttd-a0)"
depends_on:
  - I0064
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "Nouns are matched from the game's language files (every case form, joined to English by string id), restricted to names present in this game, in the sentence's detected language plus English"
  - "Orderings nearest / most productive / most profitable answer over openttd://world/graph and planner v4; build returns the bot settings for the first candidate"
  - "POST /api/intent is declared once (OpenAPI, Rhai api_intent); mcp-intent works with --panel or --token"
  - "mcp-view-check proves a Czech pair query, a build query and a refusal; unit tests cover case forms and diacritics"
validation:
  - "cargo test --release --bin mcp-intent (tools/research/mcp-rhai)"
  - "tools/research/mcp-view-check"
evidence_required:
  - validation_run
