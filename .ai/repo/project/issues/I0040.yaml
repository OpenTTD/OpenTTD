id: I0040
milestone: an-agent-reaches-the-game-over-mcp
title: "Play like a person on screen: human camera motion, the bot's cursor on the tile it works on, every build step seen"
slug: human-like-presentation
priority: p0
profile: implementation
parallel_safe: false
objective: "Make the owner's game window look like a person playing: the camera glides and zooms to where the bot works, a cursor marks the tile, and each build step is visible."
why: "The owner wants to see the bot play as a human would when they grab the camera: moving view, cursor, tile selection, roads being built."
scope:
  - "src/prismatic_mcp/prismatic_mcp_view.cpp"
  - "tools/research/mcp-panel/rhai/director.rhai"
  - "research/mcp-control.md"
non_scope:
  - "Moving the owner's OS mouse pointer: it would take the mouse away from the owner"
  - "Building roads between towns: the bot builds stops, depots and buses on existing town roads; road building is a strategy change (I0041 and the bot's next strategy)"
depends_on:
  - I0038
serves:
  - "an-agent-plays-the-game-through-governed-channels#a-bot-plays-for-the-owner"
acceptance_criteria:
  - "openttd.view.mark marks a tile (or clears it) in a GUI process and answers an error in a dedicated server"
  - "The director glides on a minimum-jerk path, zooms in at the site, marks every surveyed and built tile, and follows each started bus"
  - "PrismaticAI logs the tile of every build step and paces the steps"
  - "tools/gate.sh research and mcp-panel-check pass"
validation:
  - "tools/gate.sh research"
  - "tools/research/mcp-panel-check"
evidence_required:
  - validation_run
