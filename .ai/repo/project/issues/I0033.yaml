id: I0033
milestone: an-agent-reaches-the-game-over-mcp
title: "The owner's bot: an AI that plays for the owner within knobs set and changed from the panel, REST/OpenAPI and Rhai"
slug: owners-bot
priority: p1
profile: implementation
parallel_safe: true
objective: "Let the owner run an AI as their representative and steer its behaviour from outside, with its settings derived from the game and its log on the event feed."
why: "The owner clarified that the AI is to play for them, configured and reconfigured by them, as a test bed for their AI in local and network games."
scope:
  - "tools/research/mcp-panel/**"
  - "tools/research/mcp-rhai/**"
  - "research/mcp-control.md"
non_scope:
  - "openttd.ai.* tools, client mode and operator-token approval in src/prismatic_mcp (branch research/mcp-full-auto)"
  - "PrismaticAI itself, in ~/dev/openttd-prismatic-bridge (branch feat/live-behaviour)"
  - "Approval by policy: auto-approve is the owner's call"
depends_on:
  - I0032
serves:
  - "an-agent-plays-the-game-through-governed-channels#a-bot-plays-for-the-owner"
acceptance_criteria:
  - "GET /api/bots lists the AIs with settings derived from openttd.ai.list when present, else info.nut, and the running AI companies"
  - "POST /api/bots/start starts the bot with the owner's settings; POST /api/bots/setting goes through openttd.ai.set_setting once the game has it and says so until then"
  - "The panel's My bot card renders the derived settings form, starts the bot and shows the running bots"
  - "Rhai derives api_<operationId> from the panel's OpenAPI, and ttd::bots/start_bot/set_bot/bot_log wrap them"
  - "Any tool answering pending_approval is tracked with an Approve button and resubmitted with the same arguments"
validation:
  - "tools/research/mcp-panel-check --panel http://127.0.0.1:8800"
  - "curl http://127.0.0.1:8800/api/bots"
evidence_required:
  - validation_run
