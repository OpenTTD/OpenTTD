id: I0065
milestone: an-agent-reaches-the-game-over-mcp
title: "GraphQL over the hub, derived from its method table"
slug: hub-graphql
priority: p2
profile: implementation
parallel_safe: true
objective: "Everything the hub offers is a GraphQL query or mutation too, with its SDL, derived from the same method table as JSON-RPC, OpenAPI and Rhai."
why: "The owner: everything exposed through MCP, events, WebSocket, GraphQL, documented, enforced and tested."
scope:
  - "tools/research/mcp-rhai/**"
  - "research/mcp-hub.md"
  - "research/README.md"
  - ".ai/**"
depends_on:
  - I0058
serves:
  - "an-agent-plays-the-game-through-governed-channels#mcp-reads-live-state"
acceptance_criteria:
  - "POST /graphql answers queries and mutations through the hub's own dispatch; GET /graphql/schema is derived from the method table"
  - "Aliases, arguments, variables, literals and selection projection work; fragments, directives, introspection and subscriptions are refused by name"
  - "GraphQL is in the hub's OpenAPI document; cargo test --bin mcp-hub covers the parser, execution and the end-to-end route"
validation:
  - "cargo test --offline --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-hub"
evidence_required:
  - validation_run
created_at: '2026-11-16'
updated_at: '2026-11-16'
