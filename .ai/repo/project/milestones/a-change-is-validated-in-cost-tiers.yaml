id: a-change-is-validated-in-cost-tiers
title: "A change is validated at the tier its size needs, and the report cannot round up"
slug: a-change-is-validated-in-cost-tiers
order: 20
priority: p0
problem: "Without tiers, an agent either ran nothing and reported success or ran a clean-room build for a doc fix, and a partial result read like a pass. Proposed in ADR 0002 (status: proposed; accepting them is the owner's act)."
outcome: "tools/gate.sh smoke|change|full wraps the CMake/CTest toolchain, and reports use the fail-closed PASS/FAIL/PARTIAL/NOT RUN/NOT APPLICABLE taxonomy."
acceptance_criteria:
- "tools/gate.sh change builds and runs the full ctest suite and exits non-zero on failure"
- "research/README.md defines the five-state taxonomy and research/experiment-template.md uses it"
- "A runtime prerequisite that makes the suite hang (the macOS base set dialog) is documented"
validation:
- tools/gate.sh change
evidence_required: []
