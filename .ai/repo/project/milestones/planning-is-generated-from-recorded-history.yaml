id: planning-is-generated-from-recorded-history
title: "Planning decisions read recorded history from the store and publish what they chose as data"
slug: planning-is-generated-from-recorded-history
order: 80
priority: p2
problem: "Every planning decision (the bot's lines, own_lines, rail_after, calibration, Prismatic's aggressiveness, AlgoGlyph's kernel inputs, a duel's reading) works on one live snapshot or a hand constant, and publishes its choice only as an English sentence. I0080 records every event in a store; nothing reads it yet. Proposed in ADR 0034 (status: proposed; accepting it is the owner's act)."
outcome: "Each decision point reads trailing history through /api/db/query with a stated fallback, publishes a structured plan.* event (decision, version, inputs, choice), and Prismatic, AlgoGlyph and mcp-duel consume the bus or the store instead of prose or capped lists. A default derived from history is kept only when held-start duel pairs on three seeds favour it."
acceptance_criteria:
- "Every decision point of panel_bot.rs, plan.rs and panel_decision.rs publishes a plan.* event declared in one table; mcp-panel-check sees each after a planned bot start"
- "Calibration is read from the store; research/calibration.json is no longer read by the panel"
- "mcp-duel reads plan.* events and stored samples, not /api/status prose"
- "The hub's audit.* and panel-less game.* events reach a store"
- "Prismatic and an AlgoGlyph flow serve subscriber read the bus or the store, never the console"
- "own_lines and rail_after come from stored duel outcomes, with an A/B on held-start pairs over three seeds recorded under research/results/"
validation:
- "cargo test --release -q --manifest-path tools/research/mcp-rhai/Cargo.toml --bin mcp-panel"
- tools/research/mcp-panel-check
evidence_required: []
created_at: '2026-11-18'
updated_at: '2026-11-18'
