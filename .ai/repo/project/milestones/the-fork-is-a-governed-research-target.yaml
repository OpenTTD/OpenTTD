problem: "An agent reading an upstream fork takes upstream's contribution process as its own, and may try to contribute; the fork's research purpose and its relationship to Prismatic were written nowhere. Proposed in ADR 0001, ADR 0003 (status: proposed; accepting them is the owner's act)."
outcome: "README, AGENTS.md and the .ai/ rules say once what the fork is for, what it is not, how it relates to Prismatic, and which rules bind every agent."
acceptance_criteria:
- "AGENTS.md is the single vendor-neutral statement of the ground rules; CLAUDE.md points to it"
- "README section 0.0 states purpose, goals, non-goals, the Prismatic relationship and the upstream-versus-fork tree"
- "The ground rules exist as project rules under .ai/repo/rules/project/"
